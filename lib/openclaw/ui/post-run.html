<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RC 会话控制台</title>
  <link rel="stylesheet" href="/plugins/runtime-corrector/post-run.css">
</head>
<body>
<main>
  <h1>RC 会话控制台</h1>
  <section id="connect-form" aria-label="连接宿主">
    <label for="token">Gateway 凭据</label>
    <input id="token" type="password" autocomplete="off" placeholder="已完成设备认证时可留空">
    <button id="connect" type="button">连接</button>
  </section>
  <p id="connection" role="status">未连接</p>
  <p id="error" role="alert" hidden></p>
  <label for="sessions">宿主会话</label>
  <select id="sessions" disabled><option value="">请选择会话</option></select>
  <section id="selected" aria-label="所选宿主会话" hidden>
    <header>
      <h2 id="name"></h2>
      <p id="project" class="muted"></p>
    </header>
    <section class="preview" aria-label="MA 输入框状态栏预览">
      <h3>MA 输入框状态栏预览</h3>
      <p id="phase" role="status"></p>
    </section>
    <p id="switches" class="muted"></p>
    <ul id="activities" aria-label="当前纠偏 Agent"></ul>
    <p id="brief" class="muted"></p>
    <details id="review">
      <summary>本轮终审 <strong id="outcome"></strong></summary>
      <div id="review-details"></div>
    </details>
    <details id="repair" hidden>
      <summary>本轮修复输入</summary>
      <p id="repair-source" class="muted"></p>
      <pre id="repair-text"></pre>
    </details>
    <div class="termination">
      <button id="terminate" type="button" disabled>停止本轮纠偏</button>
      <span id="stop-receipt" role="status"></span>
    </div>
  </section>
</main>
<script type="module" src="/plugins/runtime-corrector/post-run.mjs"></script>
</body>
</html>
