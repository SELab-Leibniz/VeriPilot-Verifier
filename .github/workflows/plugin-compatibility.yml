name: Plugin compatibility

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  compatibility:
    name: Node 18 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build both host artifacts
        run: npm run build:plugins
      - name: Verify generated artifacts
        run: npm run test:artifacts
      - name: Run full suite
        run: npm test
      - name: Benchmark the declared SessionEnd hook
        run: npm run benchmark:session-end

  release:
    name: Publish host-specific plugin archives
    if: startsWith(github.ref, 'refs/tags/')
    needs: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm run build:plugins
      - name: Create host-specific archives
        working-directory: dist
        run: |
          zip -qr runtime-corrector-claude.zip runtime-corrector-claude
          zip -qr runtime-corrector-codeagent.zip runtime-corrector-codeagent
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/runtime-corrector-claude.zip
            dist/runtime-corrector-codeagent.zip
