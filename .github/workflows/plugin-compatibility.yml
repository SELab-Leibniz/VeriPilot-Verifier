name: Plugin compatibility

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  compatibility:
    name: Node 18 / ${{ matrix.os }}
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build all host artifacts
        run: npm run build:plugins
      - name: Verify generated artifacts
        run: npm run test:artifacts
      - name: Run cross-host compatibility tests
        run: >-
          node --test
          test/plugin-root.test.mjs
          test/plugin-bootstrap-process.test.mjs
          test/plugin-root-propagation.test.mjs
          test/plugin-capability-floor.test.mjs
          test/reviewer-deadline.test.mjs
          test/reviewer-launcher.test.mjs
          test/reviewer-runtime-config.test.mjs
          test/reviewer-runtime-process.test.mjs
          test/reviewer-handoff.test.mjs
          test/reviewer-evidence.test.mjs
          test/reviewer-artifact-handoff.test.mjs
          test/reviewer-runtime-hook.test.mjs
          test/session-end-process.test.mjs

  runtime:
    name: Node 24 / ${{ matrix.os }} / shard ${{ matrix.shard }}
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Scheduling experiment: keep every test and deadline, but divide Windows
        # across two VMs with two file workers each. This does not establish a
        # cause for earlier failures. Each job logs its complete shard inventory.
        include:
          - os: ubuntu-latest
            shard: 1/1
            file-concurrency: 4
          - os: macos-latest
            shard: 1/1
            file-concurrency: 4
          - os: windows-latest
            shard: 1/2
            file-concurrency: 2
          - os: windows-latest
            shard: 2/2
            file-concurrency: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix lib/review-task --ignore-scripts
      - name: Install pinned OpenClaw test host
        run: npm install --prefix .ci/openclaw --ignore-scripts --no-package-lock --no-audit --no-fund openclaw@2026.7.1-2
      - run: npm run build:plugins
      - name: Verify artifacts and entry points
        run: npm run test:artifacts
      - name: Run assigned test files
        # Native lifecycle tests exercise real deadline windows. Windows needs
        # more than 90 seconds for that file; retain a bounded process deadline.
        run: >-
          npm test -- --openclaw-host=.ci/openclaw/node_modules/openclaw
          --file-timeout-ms=180000 --file-concurrency=${{ matrix.file-concurrency }}
          --file-shard=${{ matrix.shard }}

  release:
    name: Publish host-specific plugin archives
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    needs: [compatibility, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build:plugins
      - name: Create host-specific archives
        working-directory: dist
        run: |
          zip -qr runtime-corrector-claude.zip runtime-corrector-claude
          zip -qr runtime-corrector-codeagent.zip runtime-corrector-codeagent
          zip -qr runtime-corrector-openclaw.zip runtime-corrector-openclaw
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/runtime-corrector-claude.zip
            dist/runtime-corrector-codeagent.zip
            dist/runtime-corrector-openclaw.zip
