# Runtime Corrector default project configuration, copied by /rc-project init.
# The command sets the reviewer model from the current OpenClaw RC settings.
# Project and first-enrollment Session switches start disabled.
version: 2

# 每个 RC agent 单次模型输出上限；评审角色可在 reviewers 中覆盖。
maxOutputTokens: 32768

# 项目总开关
enabled: false

sessionDefaults:
  # 所有首次登记的 Session 默认关闭 RC
  enabled: false

# Locale for the highest-visibility developer-facing messages: zh (default) or en.
locale: zh

# OpenSpec's hidden workflow emits these three stages in dependency order.
enabledStages:
  - proposal
  - design
  - tasks

# changeName is generated by the agent, so pathTemplates capture it as a
# workflow instance key instead of coupling the configuration to one folder.
artifacts:
  - name: proposal
    stage: proposal
    type: proposal
    format: markdown
    editable: true
    pathTemplates:
      - "openspec/changes/{changeName}/proposal.md"
    rules:
      enabled: false
    review:
      enabled: true
      criteria: example.reviewer.md

  - name: design
    stage: design
    type: design
    format: markdown
    editable: true
    pathTemplates:
      - "openspec/changes/{changeName}/design.md"
    rules:
      enabled: false
    review:
      enabled: true
      criteria: example.reviewer.md

  - name: tasks
    stage: tasks
    type: tasks
    format: markdown
    editable: true
    pathTemplates:
      - "openspec/changes/{changeName}/tasks.md"
    rules:
      enabled: false
    review:
      enabled: true
      criteria: example.reviewer.md

# Direct edges describe every upstream artifact read by a target. Runtime
# Corrector does not expand transitive dependencies, so tasks reads both
# proposal and design explicitly.
workflow:
  correlation:
    keys:
      - changeName
  edges:
    - from: proposal
      to: design
      review:
        enabled: true
        criteria: example.reviewer.md
    - from: proposal
      to: tasks
      review:
        enabled: true
        criteria: example.reviewer.md
    - from: design
      to: tasks
      review:
        enabled: true
        criteria: example.reviewer.md

ignorePatterns:
  - "**/.runtime-correction/**"
  - "**/.git/**"
  - "**/.hvigor/**"
  - "**/oh_modules/**"
  - "**/node_modules/**"
  - "**/build/**"
  - "**/.preview/**"

dynamicGroundTruth:
  enabled: true
  panel:
    size: 2
    adjudicator: true

artifactCorrection:
  groundTruthReviewEnabled: true

stopCorrection:
  enabled: true
  waitMode: until_pass

  maxCorrectionsPerSession: 2
  maxCorrectionsPerFlow: 2

  assessmentTimeoutMs: 3600000
  feedbackReserveMs: 180000
  reviewGroupSize: 3

  fileQualityReviewEnabled: false

deviationLoop:
  maxDeliveriesPerFamily: 5

implementationCorrection:
  enabled: true
  platform: harmonyos
  deviceBudgetMs: 1800000

evidenceRoots: [evidence]

output:
  directory: .runtime-correction

# v1 文档语义审查的超时，与 v2 reviewer 保持一致。
# OpenSpec 文档语义审查使用此时限；角色评审使用下方 reviewers 的时限。
limits:
  semanticReviewTimeoutMs: 1800000

# 原生 OpenClaw reviewer：项目设置覆盖插件默认值。
# model 使用 openclaw.json 已注册的 provider/model；不填写 API key。
# 格式修复属于本角色时间窗，不会续期。
reviewers:
  defaults:
    model: custom/deepseek-v4-flash
    effort: low
    timeoutMs: 1800000
    formatRepairAttempts: 3

skillCorrection:
  enabled: false
